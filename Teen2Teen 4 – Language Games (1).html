function boom(n){addPts(10);const c=["🎉","⭐","✨","🎈","💜"];for(let i=0;i<n;i++){const s=document.createElement("span");s.className="cf";s.textContent=c[i%5];s.style.left=Math.random()*95+"%";s.style.animationDelay=Math.random()*.4+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2500)}}
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const MODES=[["listen","Listening","شنیداری"],["long","Long listening","شنیدن طولانی"],["flash","Flashcards","فلش‌کارت"],["match","Match","وصل کردن"],["quiz","Quiz","آزمون"],["gram","Grammar","گرامر"]];

function head(){who();

function start(){RUN++;try{speechSynthesis.cancel()}catch(e){}
 const w=words();S={};
 if(mode=="flash"){S.d=sh(w);S.i=0;S.f=false}
 if(mode=="match"){S.score=0;round()}
 if(mode=="quiz"){S.q=sh(w).slice(0,10).map(p=>({p,fw:Math.random()<.5,o:sh([p,...sh(w.filter(x=>x!==p)).slice(0,3)])}));S.i=0;S.s=0;S.a=null}
 if(mode=="long"){const ks=Object.keys(LT);S.k=unit=="all"?ks[Math.floor(Math.random()*ks.length)]:unit;S.li=-1;S.show=false;S.qi=-1;S.s=0;S.a=null;S.slow=false}

function drawB(A){const M={};for(const n in CLASS)M[n]={pts:CLASS[n]};for(const n in BD)M[n]={pts:Math.max((M[n]||{}).pts||0,BD[n].pts)};const r=Object.entries(M).sort((a,b)=>b[1].pts-a[1].pts),m=["🥇","🥈","🥉"],top=Math.max(1,r.length?r[0][1].pts:1);
 A.innerHTML=`<div class="card"><h2 style="margin:0 0 8px">🏆 Leaderboard</h2>${r.length?r.map(([n,b],i)=>`<div style="margin:10px 0"><div class="bar" style="color:var(--ink);font-size:16px"><span>${m[i]||(i+1)+"."} ${esc(n)}${n==ME?" (you)":""}</span><b>${b.pts} pts</b></div><div style="height:8px;border-radius:8px;background:var(--chip)"><div style="height:8px;border-radius:8px;width:${Math.max(4,b.pts/top*100)}%;background:var(--pri)"></div></div></div>`).join(""):`<p style="color:var(--mut)">No scores yet. Enter your name and play! <span class="fa">اسمت را بنویس و بازی کن</span></p>`}<p style="color:var(--mut);font-size:13px;margin-bottom:0">10 points for every correct answer. Your points are saved on this device; the teacher adds everyone’s results to the class ranking.</p></div>
 <div class="card"><b>Add a result</b> <span class="fa" style="color:var(--mut);font-size:13px">برای ثبت نتیجه‌ی دستگاه دیگر</span><div class="row"><input id="an" class="in" placeholder="Name" maxlength="16" style="flex:1;min-width:110px"><input id="ap" class="in" type="number" min="0" placeholder="Points" style="width:100px"><button class="btn" data-a="ad">Add</button></div></div>

function playG(){try{speechSynthesis.cancel();const L=LT[S.k].l,id=++RUN;let i=0;const go=()=>{if(RUN!=id||mode!="long"||S.qi>=0)return;if(i>=L.length){S.li=-1;draw();return}S.li=i;draw();const u=new SpeechSynthesisUtterance(L[i][1]);u.lang="en-US";u.rate=S.slow?.7:.95;u.pitch=L[i][0]?.8:1.25;u.onend=()=>{i++;setTimeout(go,400)};speechSynthesis.speak(u)};go()}catch(e){}}

function drawL(A){const s=ST[S.k],n=s.sc.length;
 if(S.qi>=0){

function draw(){
 const A=$("#app");
 if(mode=="board")return drawB(A);

  <div class="row"><button class="btn alt" data-a="pv">← Back</button><button class="btn" data-a="nx">Next →</button><button class="btn alt" data-a="re">Shuffle</button></div>`}

 if(mode=="gram"){

});
